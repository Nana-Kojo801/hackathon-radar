name: Refresh hackathons

on:
  # Every 6 hours, off the top of the hour. GitHub starts these hours late (and skips some), so the
  # Cloudflare Worker's cron starts each run on time through the API (POST /schedule/tick); this
  # schedule is the fallback, and skips itself when a run has already happened.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources to run (blank = all): devpost,devfolio,mlh,taikai,ethglobal,unstop,web"
        required: false
        default: ""

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Skip a late scheduled run
        id: guard
        if: github.event_name == 'schedule'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Another run started in the last 3 hours (on time from the Worker, or by hand): this one is redundant.
          since=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh.yml --limit 10 --json databaseId,createdAt \
            --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and .createdAt >= \"$since\")] | length")
          if [ "${recent:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A refresh already ran in the last 3 hours; skipping this late scheduled run."
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Run pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          MAX_ENRICH_PER_RUN: ${{ vars.MAX_ENRICH_PER_RUN || '60' }}
          MAX_DISCOVERY_PAGES: ${{ vars.MAX_DISCOVERY_PAGES || '12' }}
          MAX_POLISH_PER_RUN: ${{ vars.MAX_POLISH_PER_RUN || '40' }}
          MAX_ARTWORK_PER_RUN: ${{ vars.MAX_ARTWORK_PER_RUN || '60' }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set yet; skipping refresh (see README > Deploy)."
            exit 0
          fi
          if [ -n "$SOURCES" ]; then
            python -m pipeline.run --sources "$SOURCES"
          else
            python -m pipeline.run
          fi
      - name: Emails and push notifications
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then exit 0; fi
          python -m app.notify
