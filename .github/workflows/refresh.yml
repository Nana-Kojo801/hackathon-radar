name: Refresh hackathons

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (off the top of the hour to dodge the cron rush)
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources to run (blank = all): devpost,devfolio,mlh,taikai,ethglobal,unstop,web"
        required: false
        default: ""

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          MAX_ENRICH_PER_RUN: ${{ vars.MAX_ENRICH_PER_RUN || '60' }}
          MAX_DISCOVERY_PAGES: ${{ vars.MAX_DISCOVERY_PAGES || '12' }}
          MAX_POLISH_PER_RUN: ${{ vars.MAX_POLISH_PER_RUN || '40' }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set yet; skipping refresh (see README > Deploy)."
            exit 0
          fi
          if [ -n "$SOURCES" ]; then
            python -m pipeline.run --sources "$SOURCES"
          else
            python -m pipeline.run
          fi
      - name: Emails and push notifications
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then exit 0; fi
          python -m app.notify
