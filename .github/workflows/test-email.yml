name: Send test email

# Checks the email setup: Actions > Send test email > Run workflow.
# Needs the RESEND_API_KEY and NOTIFY_EMAIL secrets (see README > Emails).

on:
  workflow_dispatch:

jobs:
  test-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$NOTIFY_EMAIL" ]; then
            echo "::error::Add the RESEND_API_KEY and NOTIFY_EMAIL secrets first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          python -m app.notify --test
